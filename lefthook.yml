pre-commit:
  parallel: true
  commands:
    lint:
      glob: "src/**/*.{ts,tsx,json}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    stylelint:
      glob: "src/**/*.css"
      run: bunx stylelint --fix {staged_files}
      stage_fixed: true
    test:
      run: bun test
